<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🌈 My Page</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      text-align: center;
      padding: 2rem;
      transition: all 0.4s ease;
      background-color: blue;
      color: pink;
    }
    h1 { font-size: 2.5rem; margin-bottom: 1rem; }
    button {
      padding: 1rem 2rem;
      font-size: 1.2rem;
      border: none;
      border-radius: 10px;
      background-color:white;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    button:hover { background-color: yellow; }
    .dark {
      background-color: black;
      color: white;
    }
  </style>
</head>
<body>
  <h1 id="welcome">👋 Hello there!</h1>
  <p id="greeting">Let's make your page come alive ✨</p>
  <button id="themeBtn">🌗 Toggle Dark Mode</button>

  <script>
    <button onclick="toggleMode()">Toggle Dark Mode</button>
    function toggleMode() {
  document.body.classList.toggle("dark-mode");
}

    const btn = document.getElementById('themeBtn');
    const body = document.body;

    btn.addEventListener('click', () => {
      body.classList.toggle('dark');
    });

    // Ask for visitor's name
    const name = prompt("What's your name?");
    if (name) {
      document.getElementById('welcome').textContent = `Welcome, ${name}! 🎉`;
    }

    // Dynamic greeting
    const hour = new Date().getHours();
    let message;
    if (hour < 12) message = "☀️ Good morning!";
    else if (hour < 18) message = "🌤️ Good afternoon!";
    else message = "🌙 Good evening!";
    document.getElementById('greeting').textContent = message;
  </script>
</body>
</html>
